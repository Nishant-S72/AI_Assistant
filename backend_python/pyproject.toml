[tool.poetry]
name = "ai-chief-of-staff-backend"
version = "1.0.0"
description = "AI Chief-of-Staff Backend API (Python)"
authors = ["Nishant Sangwan <nishant.sangwan7291@gmail.com>"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

