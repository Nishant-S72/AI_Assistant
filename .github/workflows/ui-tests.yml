name: UI Tests

on:
  pull_request:
    branches: [main, Python-version]
  push:
    branches: [main, Python-version]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aichief_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend_python/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend_python
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Setup test database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aichief_test
        working-directory: backend_python
        run: |
          psql $DATABASE_URL -f db/migrations/006_create_scheduler_tables.sql || true

      - name: Run UI tests
        working-directory: frontend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aichief_test
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          SKIP_BACKEND: false
        run: |
          npx playwright test --project=chromium --reporter=html,json,junit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: frontend/tests/ui/playwright/artifacts/
          retention-days: 30

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-html-report
          path: frontend/tests/ui/playwright/artifacts/html-report/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/tests/ui/playwright/artifacts/junit.xml
          check_name: Playwright Test Results

